apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine-mcp
  namespace: affine
  labels:
    app.kubernetes.io/name: affine-mcp
    app.kubernetes.io/part-of: affine
    app.kubernetes.io/component: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: affine-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: affine-mcp
        app.kubernetes.io/part-of: affine
        app.kubernetes.io/component: mcp
    spec:
      hostIPC: false
      hostPID: false
      hostNetwork: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: affine-mcp
          image: ghcr.io/dawncr0w/affine-mcp-server:2.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: HOME
              value: /tmp
            - name: MCP_TRANSPORT
              value: http
            - name: PORT
              value: "3000"
            - name: AFFINE_MCP_HTTP_HOST
              value: 0.0.0.0
            - name: AFFINE_BASE_URL
              value: http://affine.affine.svc.cluster.local:3010
            - name: AFFINE_MCP_AUTH_MODE
              value: bearer
            - name: AFFINE_TOOL_PROFILE
              value: full
            - name: AFFINE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: affine-mcp-secrets
                  key: AFFINE_API_TOKEN
            - name: AFFINE_MCP_HTTP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: affine-mcp-secrets
                  key: AFFINE_MCP_HTTP_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

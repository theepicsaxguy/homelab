apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: gitlab-postgresql-b2-backup
  namespace: gitlab
spec:
  schedule: "0 0 3 * * 0"
  backupOwnerReference: self
  cluster:
    name: gitlab-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: gitlab-b2-store

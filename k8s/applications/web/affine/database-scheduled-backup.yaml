---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: affine-postgresql-backup
  namespace: affine
spec:
  schedule: "0 0 2 * * 0"
  backupOwnerReference: self
  cluster:
    name: affine-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: affine-b2-store

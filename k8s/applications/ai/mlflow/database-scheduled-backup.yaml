apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: mlflow-postgresql-b2-backup
  namespace: mlflow
spec:
  schedule: "0 0 3 * * 0"
  backupOwnerReference: self
  cluster:
    name: mlflow-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: mlflow-b2-store

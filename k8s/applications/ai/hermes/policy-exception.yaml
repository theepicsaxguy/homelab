apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: hermes-security-exceptions
  namespace: hermes
  annotations:
    description: "Exception for hermes containers that require a writable root filesystem for agent state management outside named volume paths."
spec:
  match:
    any:
    - resources:
        kinds:
          - Deployment
        namespaces:
          - hermes
        names:
          - hermes
  exceptions:
    - policyName: nsa-hardening-all-namespaces
      ruleNames:
        - require-read-only-root-filesystem

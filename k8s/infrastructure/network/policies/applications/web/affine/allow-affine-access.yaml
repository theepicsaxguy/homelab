apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: affine-postgresql-backup
  namespace: affine
  labels:
    policy-type: web-audit
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  description: "Allow PostgreSQL WAL archiving to RustFS"
  egress:
  - toFQDNs:
    - matchName: "truenas.peekoff.com"
    toPorts:
    - ports:
      - port: "30293"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP

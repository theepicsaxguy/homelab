apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: minecraft-server-access
  labels:
    policy-type: games-audit
spec:
  endpointSelector: {}  # Applies to all pods in minecraft namespace (minecraft-bedrock + bedrockconnect)
  description: "Allow Minecraft server access from game clients"
  ingress:
  - fromEntities: ["world"]  # External game clients (Java: 25565/TCP, Bedrock: 19132/UDP)
    toPorts:
    - ports:
      - port: "25565"
        protocol: TCP
      - port: "19132"
        protocol: UDP
  egress:
  - toEntities: ["kube-apiserver"]
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  - toEntities: ["world"]  # Paper jar + plugin downloads from external hosts
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
      - port: "80"
        protocol: TCP
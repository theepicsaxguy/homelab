apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Gateway API CRDs required by Cilium 1.20 (v1 TLSRoute, ReferenceGrant, BackendTLSPolicy).
# Experimental channel is needed for the TCPRoute/UDPRoute used by the gateway listeners.
resources:
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/experimental-install.yaml

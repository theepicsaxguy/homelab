---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-longhorn-backup-secret
  namespace: gitlab
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: bitwarden-backend
    kind: ClusterSecretStore
  target:
    name: longhorn-minio-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: infra-minio-s3-access-key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: infra-minio-s3-secret-key
    - secretKey: AWS_ENDPOINTS
      remoteRef:
        key: infra-minio-s3-endpoint-url
    - secretKey: LOGICAL_BACKUP_S3_ENDPOINT
      remoteRef:
        key: infra-minio-s3-endpoint-url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-minio-connection-secret
  namespace: gitlab
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: bitwarden-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-minio-connection
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        connection: |
          provider: AWS
          region: us-east-1
          aws_access_key_id: {{ .accessKey }}
          aws_secret_access_key: {{ .secretKey }}
          aws_signature_version: 4
          host: rustfs.rustfs.svc.cluster.local
          port: '9000'
          endpoint: http://rustfs.rustfs.svc.cluster.local:9000
          path_style: true
  data:
    - secretKey: accessKey
      remoteRef:
        key: app-rustfs-access-key
    - secretKey: secretKey
      remoteRef:
        key: app-rustfs-secret-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-registry-storage-secret
  namespace: gitlab
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: bitwarden-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-registry-storage
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config: |
          filesystem:
            rootdirectory: /var/lib/registry
          delete:
            enabled: true
  data:
    - secretKey: accessKey
      remoteRef:
        key: infra-minio-s3-access-key
    - secretKey: secretKey
      remoteRef:
        key: infra-minio-s3-secret-key
